<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt the Pitch: 3D stadium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: "Inter", system-ui, sans-serif; color: #fff; }
    canvas { display: block; }
    [hidden] { display: none !important; }
    .bug { position: absolute; top: 18px; left: 18px; font-family: "Barlow Condensed", sans-serif; min-width: 380px; }
    .bug .row { display: grid; grid-template-columns: auto 1fr auto 1fr auto auto; align-items: center; background: #15171c; height: 44px; }
    .bug .sw { width: 7px; height: 100%; }
    .bug .name { font-size: 21px; font-weight: 600; letter-spacing: 0.04em; padding: 0 14px; text-transform: uppercase; }
    .bug .name.away { text-align: right; }
    .bug .score { background: #fff; color: #15171c; font-size: 29px; font-weight: 700; padding: 0 13px; line-height: 44px; font-variant-numeric: tabular-nums; }
    .bug .clock { font-size: 21px; font-weight: 600; padding: 0 14px; border-left: 1px solid #3a3e47; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
    .tag { position: absolute; top: 18px; right: 18px; background: rgba(21, 23, 28, 0.85); font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; }
    .tag span { color: #9fd8b8; }
    .cam-name { position: absolute; top: 58px; right: 18px; font-size: 12px; color: #c9ccd1; text-transform: uppercase; letter-spacing: 0.08em; }
    .l3 { position: absolute; left: 18px; bottom: 92px; width: min(560px, calc(100vw - 36px)); display: grid; grid-template-columns: 8px 1fr; background: #fff; color: #15171c; animation: in 0.35s ease-out; }
    .l3 .content { padding: 11px 16px 13px; }
    .l3 .kicker { font-size: 12px; color: #7d828c; text-transform: uppercase; letter-spacing: 0.06em; }
    .l3 .title { font-family: "Barlow Condensed", sans-serif; font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1.05; margin: 2px 0 5px; }
    .l3 .body { font-size: 15px; color: #464a53; line-height: 1.4; }
    .l3 .figures { margin-top: 6px; font-size: 13px; }
    .l3 .sep { color: #7d828c; padding: 0 6px; }
    @keyframes in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .label { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #15171c; font-size: 13px; font-weight: 600; padding: 2px 7px; border-left: 4px solid #15171c; white-space: nowrap; pointer-events: none; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px; background: linear-gradient(transparent, rgba(5, 8, 14, 0.9) 40%); font-size: 13px; }
    .bar button, .bar select { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); padding: 6px 10px; font: inherit; cursor: pointer; }
    .bar button.on { background: #fff; color: #15171c; }
    .bar .group { display: flex; gap: 4px; align-items: center; }
    .bar .label-txt { color: #9aa0a8; margin-right: 2px; }
    .bar input[type=range] { flex: 1 1 220px; accent-color: #9fd8b8; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Barlow Condensed", sans-serif; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="loading" id="loading">Building the stadium…</div>
  <div class="bug" id="bug" hidden>
    <div class="row">
      <span class="sw" id="home-sw"></span><span class="name" id="home-name"></span>
      <span class="score"><span id="score-home">0</span> – <span id="score-away">0</span></span>
      <span class="name away" id="away-name"></span><span class="sw" id="away-sw"></span>
      <span class="clock" id="clock">0'</span>
    </div>
  </div>
  <div class="tag">AI insights · <span>Prompt the Pitch</span></div>
  <div class="cam-name" id="cam-name"></div>
  <div id="overlay"></div>
  <div class="label" id="label" hidden></div>
  <div class="bar" id="bar" hidden>
    <button id="play">Pause</button>
    <div class="group"><span class="label-txt">Speed</span>
      <select id="speed"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>30</option></select>
    </div>
    <div class="group" id="cams"></div>
    <input type="range" id="seek" min="0" max="1" step="1" value="0">
    <div class="group" id="goals"></div>
    <button id="sound">Sound off</button>
  </div>
  <script type="module" src="stadium.js"></script>
</body>
</html>
