<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt the Pitch: broadcast overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Transparent page: OBS (or any graphics engine) composites it over the match video. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Inter", system-ui, sans-serif; }
    body.preview { background: #1d2a20 url("pitch.png") center / cover no-repeat; }
    .bug { position: absolute; top: 4vh; left: 3vw; font-family: "Barlow Condensed", sans-serif; color: #fff; min-width: 34vw; }
    .bug .row { display: grid; grid-template-columns: auto 1fr auto 1fr auto auto; align-items: center; background: #15171c; height: 5.4vh; }
    .bug .sw { width: 0.6vw; height: 100%; }
    .bug .name { font-size: 2.6vh; font-weight: 600; letter-spacing: 0.04em; padding: 0 1.2vw; text-transform: uppercase; }
    .bug .name.away { text-align: right; }
    .bug .score { background: #fff; color: #15171c; font-size: 3.6vh; font-weight: 700; padding: 0 1.1vw; line-height: 5.4vh; font-variant-numeric: tabular-nums; }
    .bug .clock { font-size: 2.6vh; font-weight: 600; padding: 0 1.2vw; border-left: 1px solid #3a3e47; min-width: 4.5vw; text-align: center; font-variant-numeric: tabular-nums; }
    .win { display: flex; height: 0.6vh; }
    .win span { height: 100%; transition: width 0.6s ease; }
    .win .draw { background: #c9ccd1; }
    .winlabel { background: rgba(21, 23, 28, 0.85); color: #e8eaee; font-family: "Inter", sans-serif; font-size: 1.45vh; padding: 0.4vh 1vw; }
    .winlabel b { color: #fff; font-variant-numeric: tabular-nums; }
    .tag { position: absolute; top: 4vh; right: 3vw; background: rgba(21, 23, 28, 0.85); color: #fff; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.9vh; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.6vh 1vw; }
    .tag span { color: #9fd8b8; }
    .l3-box { position: absolute; left: 3vw; bottom: 7vh; width: min(46vw, 900px); }
    .l3 { display: grid; grid-template-columns: 0.7vw 1fr; background: #fff; color: #15171c; animation: in 0.35s ease-out; }
    .l3.leaving { animation: out 0.3s ease-in forwards; }
    .l3 .content { padding: 1.4vh 1.4vw 1.6vh; }
    .l3 .kicker { font-size: 1.5vh; color: #7d828c; text-transform: uppercase; letter-spacing: 0.06em; }
    .l3 .title { font-family: "Barlow Condensed", sans-serif; font-size: 4.2vh; font-weight: 700; text-transform: uppercase; line-height: 1.05; margin: 0.3vh 0 0.6vh; }
    .l3 .body { font-size: 2.1vh; color: #464a53; line-height: 1.35; }
    .l3 .figures { margin-top: 0.8vh; font-size: 1.8vh; }
    .l3 .figures b { font-variant-numeric: tabular-nums; }
    .l3 .sep { color: #7d828c; padding: 0 0.5vw; }
    .note { position: absolute; right: 3vw; bottom: 3vh; max-width: 30vw; background: rgba(255, 255, 255, 0.92); color: #15171c; font-size: 1.4vh; padding: 0.8vh 1vw; line-height: 1.4; }
    @keyframes in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes out { to { opacity: 0; transform: translateY(1vh); } }
  </style>
</head>
<body>
  <div class="bug" id="bug" hidden>
    <div class="row">
      <span class="sw" id="home-sw"></span><span class="name" id="home-name"></span>
      <span class="score"><span id="score-home">0</span> – <span id="score-away">0</span></span>
      <span class="name away" id="away-name"></span><span class="sw" id="away-sw"></span>
      <span class="clock" id="clock">0'</span>
    </div>
    <div class="win" id="win"><span class="home"></span><span class="draw"></span><span class="away"></span></div>
    <div class="winlabel" id="win-label"></div>
  </div>
  <div class="tag">AI insights · <span>Prompt the Pitch</span></div>
  <div class="l3-box" id="overlay"></div>
  <div class="note" id="note" hidden></div>
  <script type="module" src="broadcast.js"></script>
</body>
</html>
