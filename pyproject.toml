[project]
name = "prompt-the-pitch"
version = "0.1.0"
description = "Multi-agent match intelligence from synthetic football events."
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23",
    "agent-framework-foundry>=1.15",
    "azure-ai-projects>=2.7,<2.8",
    "azure-identity>=1.26",
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "openai>=3.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
