name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ITG_OFFLINE: "1"  # The tests never call Foundry: agents use their deterministic fallbacks.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q
      - name: Report the synthetic data calibration
        run: python -m scripts.calibrate --matches 20

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the container image
        run: docker build --tag prompt-the-pitch:ci .
